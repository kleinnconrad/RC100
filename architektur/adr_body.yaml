adr:
  id: ADR-009
  title: Auswahl der aerodynamischen Karosserie für 100 km/h Speedruns
  status: entschieden
  date: '2026-03-12'
  context: "Bei einer Zielgeschwindigkeit von 100 km/h (ca. 27,7 m/s) ist die Karosserie\
    \ kein rein optisches \nBauteil mehr, sondern die primäre aerodynamische Schutzschicht.\
    \ Eine klassische, eckige Karosserie \nfängt Luft unter der Frontschürze ein,\
    \ was unweigerlich zu einem 'Blow-over' (Abheben durch \nStaudruck) führt. Gleichzeitig\
    \ darf der Luftwiderstand (cW-Wert) den Motor nicht unnötig einbremsen. \nDas\
    \ Carten T410R Chassis erfordert eine Breite von 190 mm. Die Materialstärke ist\
    \ kritisch: \nDünnes Lexan (< 0.5 mm) verformt sich bei 100 km/h massiv.\n"
  considered_alternatives:
  - option_id: 1
    name: Standard Tourenwagen / Bash-Karosserie (z.B. Nissan Skyline, BMW M3)
    type: Scale-Optik / High Drag
    evaluation: Optisch ansprechend, aber aerodynamisch ein Fallschirm. Hohes Risiko
      für Blow-overs. Für 100 km/h architektonisch ungeeignet.
  - option_id: 2
    name: ZooRacing Wolverine (190 mm)
    type: CFD-optimierte Wettbewerbs-Karosserie
    evaluation: Bietet extrem effiziente Strömungsführung und viel Anpressdruck auf
      der Vorderachse. Eher auf enge Kurven (Steering) ausgelegt.
  - option_id: 3
    name: Le Mans Prototype / Gruppe C (z.B. Mon-Tech M-10)
    type: Keilform / Low Drag
    evaluation: 'Die absolute Geheimwaffe für reine Speedruns. Bietet die geringstmögliche
      Stirnfläche. Nachteil: Sehr flache Bauform vorne verursacht oft Konflikte mit
      den vorderen Stoßdämpferbrücken des Carten T410R.'
  - option_id: 4
    name: ZooRacing Hellcat (190 mm, 0.7mm Regular)
    type: CFD-optimierte High-Speed Tourenwagen-Karosserie
    evaluation: Bietet eine noch flachere Dachlinie und Frontscheibe als die Wolverine.
      Exzellenter Luftstrom zum Heckflügel, extrem geringer Luftwiderstand für hohen
      Top-Speed bei gleichzeitig überragender Geradeauslauf-Stabilität.
  decision: ZooRacing Hellcat (190 mm, 0.7mm Stärke)
  body_meta:
    brand: ZooRacing
    model: Hellcat
    required_width: 190 mm
    required_thickness: 0.7 mm (Regular Weight)
  rationale: "Die Entscheidung fällt auf die ZooRacing Hellcat in der 0.7mm Standard-Stärke.\
    \ Sie stellt den \noptimalen Kompromiss aus minimalem Luftwiderstand (für das\
    \ Erreichen der 100 km/h) und sicherem \nAnpressdruck (Verhinderung von Blow-overs)\
    \ dar. Im Gegensatz zu extrem flachen LMP-Karosserien \npasst sie problemlos über\
    \ die Stoßdämpferbrücken des Carten T410R. Die Materialstärke von 0.7mm \ngarantiert,\
    \ dass die Karosserie dem massiven Staudruck bei Top-Speed standhält und nicht\
    \ zu \nvibrieren oder auf die Reifen zu schleifen beginnt.\n"
  consequences:
  - 'Lackierung: Die Karosserie wird unlackiert geliefert. Es muss zwingend spezielle
    Lexan-Farbe (Polycarbonat-Farbe, z.B. Tamiya PS-Serie) verwendet werden, da normale
    Farbe abblättern würde.'
  - 'Montage: Der mitgelieferte Heckflügel muss extrem steif verschraubt werden. Die
    Karosserielöcher müssen passgenau mit einer Lexanschere und einem Karosseriebohrer
    bearbeitet werden.'
  - 'Chassis-Vorbereitung: Der Schaumstoff-Bumper an der Front des Carten T410R muss
    exakt bündig mit der Innenseite der Frontschürze abschließen, um ein Eindrücken
    bei High-Speed zu verhindern.'
