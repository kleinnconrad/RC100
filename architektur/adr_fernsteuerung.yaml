adr:
  id: ADR-005
  title: Auswahl der Fernsteuerungsanlage für 100 km/h Speedruns
  status: entschieden
  date: '2026-03-06'
  context: "Ein RC-Car, das mit 100 km/h (ca. 27,7 Meter pro Sekunde) fährt, legt\
    \ in wenigen Sekunden \nenorme Distanzen zurück. Die Fernsteuerung (Transmitter)\
    \ und der Empfänger (Receiver) \nmüssen daher zwingend eine stabile Funkverbindung\
    \ und ein absolut verlässliches Fail-Safe \naufweisen, damit das Fahrzeug am Ende\
    \ der Beschleunigungsstrecke nicht außer Kontrolle gerät. \nEs muss abgewogen\
    \ werden zwischen maximaler Reichweite inkl. Gyro-Unterstützung und einem \nrobusten,\
    \ ausfallsicheren MVP-Ansatz (Minimum Viable Product), der die Komplexität im\
    \ Setup reduziert.\n"
  considered_alternatives:
  - option_id: 1
    name: Standard RTR / Budget-Sender (z.B. FlySky FS-GT2)
    type: Low-End / Basic 2.4 GHz
    evaluation: Sehr günstig, aber die Reichweite ist oft auf 100-150 Meter begrenzt.
      Ein massives Sicherheitsrisiko bei Speedruns. Bietet zudem keine Gyro-Unterstützung
      im Standard-Empfänger.
  - option_id: 2
    name: High-End Wettbewerbs-Sender (z.B. Sanwa MT-44 / Futaba 4PM)
    type: Premium / Ultra-Low Latency
    evaluation: Bietet stark geringe Latenzzeiten und detaillierte Setup-Möglichkeiten
      auf einem Display. optimal für verwinkelte Rennstrecken, aber für das reine
      Geradeausfahren (Speedrun) völlig überdimensioniert. Preislich oft weit über
      250 €.
  - option_id: 3
    name: DumboRC X6
    type: Mid-Range Budget-Geheimtipp
    evaluation: Verzichtet auf ein Display und Telemetrie, bietet aber eine für diese
      Preisklasse (~35 €) gigantische Reichweite von oft über 400 Metern. Die passenden
      Empfänger (X6FG) verfügen über einen integrierten, einstellbaren Gyro für perfekten
      Geradeauslauf.
  - option_id: 4
    name: Carson Reflex Wheel X1
    type: Solider MVP-Ansatz (2-Kanal 2.4 GHz)
    evaluation: Sehr zuverlässiges und bewährtes Einsteigersystem. Bietet zwar keinen
      Gyro und etwas weniger Maximalreichweite als die DumboRC, punktet aber durch
      absolute Einfachheit, ein stark robustes Fail-Safe und zwingend notwendige
      Einstellmöglichkeiten (Dual Rate) für erste 100 km/h-Tests.
  decision: X9S Radio + Mini Waterproof 4-Channel Receiver RG4CHWP
  tx_meta_transmitter:
    brand: Unbekannt
    model: X9S Radio
    type: 4-Kanal 2.4 GHz Pistolengriff-Sender
  rationale: "Die Tests mit der Carson Reflex Wheel X1 zeigten eine unzureichende Lenkgenauigkeit, da das Servo in Abhängigkeit vom Lenkausschlag nicht reproduzierbar in die Neutralposition zurückkehrte. Zur Erhöhung der Steuerpräzision wurde die Fernsteuerung X9S Radio in Kombination mit dem Empfänger RG4CHWP für 152 € beschafft.\n"
  consequences:
  - 'Empfängerinstallation: Der RG4CHWP Empfänger wird verbaut und das Fail-Safe zwingend auf Bremse/Neutral programmiert.'
  - 'Schnittstellenkompatibilität: Die Betriebsspannung des Empfängers ist mit der BEC-Ausgangsspannung des Motorreglers abzugleichen.'
  - 'Lenkwinkelbegrenzung: Die Steuerausschläge (Dual Rate) werden auf die Erfordernisse von Hochgeschwindigkeitsfahrten angepasst.'
