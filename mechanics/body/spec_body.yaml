  properties:
    aerodynamic_features:
      front: Low-drawn nose and gentle hood angle reduce dynamic pressure
        and prevent lift.
      roofline: Flat sloping roof guides the air laminar and undisturbed to the
        rear wing.
      rear_wing: Included high-downforce wing provides absolutely necessary rear stability
        at high speed.
    preparation_and_painting:
      reinigung: The inside of the body must be washed out with dish soap before painting
        to remove mold release agent residues from production.
      lack_typ: Use exclusively polycarbonate spray (e.g. Tamiya PS colors).
        Paint from the inside in several thin layers.
      schutzfolie: Only remove the outer overspray protective film after completely painting
        and drilling the holes.
    mounting_instructions:
      karosserieloecher: Do not pierce holes, but drill with a special body reamer
        to avoid cracks in the Lexan.
      bumper_support: The front foam bumper of the chassis must mechanically support the front body overhang.
      radkaesten: Cut out wheel arches with curved Lexan scissors and smooth edges
        with fine sandpaper to prevent tearing under vibrations.
