spec:
  meta:
    component: Central Drive Shaft (Center Shaft)
  properties:
    material_and_suitability:
      driveshaft:
        component: Driveshaft (Shaft)
        material: Aluminum (anodized), hollow or solid (depending on batch)
        suitability_100kmh_3s: YES. Aluminum is better here than steel, since the lower
          rotating mass generates fewer vibrations at approx. 26,000 RPM.
      joint_cups:
        component: Connectors (Diff-Inputs)
        material: Steel (Hardened)
        suitability_100kmh_3s: YES. The mounts at the differential input are made of steel
          and withstand the torque of the 3S drive.
      rpm_load:
        component: Speed load
        specification: Shaft rotates at approx. 26,000 RPM
        suitability_100kmh_3s: Critical, but doable for the kit part, as long as
          there is no imbalance.
    mandatory_durability_measures:
      centering_floating_problem:
        issue: Centering (The 'Floating' problem)
        description: The shaft must not hit back and forth in the cups
          ('chatter').
        action: Mandatory to place small O-rings or foam pads (often included in the kit
          or cut from old shock rubbers) into the cups
          before the shaft is inserted. The shaft must sit 'floating', but without play
          between the diffs.
      joint_lubrication:
        issue: Lubrication of the joints
        description: The ends of the driveshaft (dogbones) that run in the steel cups
          are metal on metal. With 3S power, massive wear occurs here
          ('hammering in').
        action: Lubricate these contact points with viscous molybdenum grease (black) or special
          'Joint Grease' to minimize friction.
      runout_check:
        issue: Check for concentricity
        description: Roll the shaft over a glass plate (or a
          mirror) before installation.
        action: If it 'wobbles' even minimally (is bent), it will set the entire chassis into destructive vibrations at 26,000
          RPM. In this
          case, it must be replaced immediately.
