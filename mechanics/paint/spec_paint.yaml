spec:
  meta:
    brand: Tamiya
    system: 3-layer metallic structure
    type: Special polycarbonate spray (Lexan) - Etches into the plastic
    properties: Highly flexible, highly resistant to peeling in crashes.
    shopping_items:
    - item_name: Tamiya PS-15 Metallic Red (100ml)
      reference_link: Search for Tamiya PS-15 at RC shops
      estimated_price_eur: 8.5
    - item_name: Tamiya PS-12 Silver (100ml)
      reference_link: Search for Tamiya PS-12 at RC shops
      estimated_price_eur: 8.5
    - item_name: Tamiya PS-5 Black (100ml)
      reference_link: Search for Tamiya PS-5 at RC shops
      estimated_price_eur: 8.5
  properties:
    preparation_prep:
      step_1_washing: Wash the body thoroughly from the INSIDE with lukewarm water and simple
        dish soap (without care additives). Dry with kitchen paper. This
        removes production grease and prevents the paint from peeling off.
      step_2_masking: Stick the included window decals from the INSIDE onto the windows.
        Rub the edges of the decals firmly with your fingernail or a toothpick,
        so that no paint can run under later.
      step_3_warming: Place all three spray cans in a bowl of
        warm (not boiling!) tap water for 10 minutes. The pressure rises slightly,
        the paint atomizes much finer and does not form thick drops when spraying.
    execution_3_layers:
      rule_number_1: LEXAN IS ALWAYS PAINTED FROM THE INSIDE! The outer, matte protective film
        stays on the body until the very last step!
      phase_1_main_color_ps15:
        passes: 3 to 4 wafer-thin layers
        technique: The FIRST layer is just a fine mist (tack coat). It MUST
          look blotchy and transparent! Do not try to make it opaque immediately.
          Wait 10 minutes. Then spray the next thin layer. Repeat
          until the red is used up.
      phase_2_brilliance_ps12:
        passes: 2 thin layers
        technique: When the red is completely dry (wait at least 30 mins), spray
          the silver in 2 passes (with a 10 min break) directly onto the red. This
          acts as a reflector for the metallic particles and makes the red shine brightly.
      phase_3_sealing_ps5:
        passes: 1 to 2 thin layers
        technique: When the silver is dry, spray the black as the final layer
          over it. This blocks any light from below, makes the red very rich
          and ensures that your car looks highly professional, black and clean from the inside.
    finish_and_assembly:
      step_1_remove_masks: When the black is dry to the touch (after approx. 1-2 hours),
        carefully peel off the window masks from the inside.
      step_2_magic_moment: Now peel off the outer, matte protective film of the body.
        Underneath, the mirror-smooth, perfect metallic red is revealed!
