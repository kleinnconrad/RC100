Body:
  meta:
    brand: ZooRacing
    model: Hellcat
    vehicle_class: 1:10 On-Road Touring Car
    width_mm: 190
    wheelbase_mm: 257
    material: Polycarbonate (Lexan)
    material_thickness_mm: 0.7
    shopping_item:
      add_to_list: true
      item_name: ZooRacing Hellcat 190mm Touring Car Body (0.7mm Regular)
      category: Body & Aerodynamics
      reference_link: Search at RC-KleinKram or Tonisport for 'ZooRacing Hellcat 0.7mm'
      estimated_price_eur: 32.9
  properties:
    aerodynamic_features:
      front: Low-drawn nose and gentle hood angle reduce dynamic pressure and prevent
        lift.
      roofline: Flat sloping roof guides the air laminar and undisturbed to the rear
        wing.
      rear_wing: Included high-downforce wing provides absolutely necessary rear stability
        at high speed.
    preparation_and_painting:
      cleaning: The inside of the body must be washed out with dish soap before painting
        to remove mold release agent residues from production.
      paint_type: Use exclusively polycarbonate spray (e.g. Tamiya PS colors). Paint
        from the inside in several thin layers.
      protective_film: Only remove the outer overspray protective film after completely
        painting and drilling the holes.
    mounting_instructions:
      body_holes: Do not pierce holes, but drill with a special body reamer to avoid
        cracks in the Lexan.
      bumper_support: The front foam bumper of the chassis must mechanically support
        the front body overhang.
      wheel_arches: Cut out wheel arches with curved Lexan scissors and smooth edges
        with fine sandpaper to prevent tearing under vibrations.
Tools:
  meta:
    description: Required tools for assembling the Carten T410R.
  properties:
    tool_list:
      hex_wrenches:
        type: Hex Wrenches
        sizes: 1.5 mm, 2.0 mm, 2.5 mm
        note: Mandatory purchase! Carten uses metric M3 machine screws throughout
          the car (no self-tapping screws). A high-quality hex wrench is highly important
          here, so as not to damage the screw heads and the hard plastic thread when
          screwing in.
        brand: Neewer
        model: Titanium RC Hex Wrench Set (1.5/2.0/2.5/3.0)
      box_wrenches:
        type: RC Cross Wrench / Box Wrench
        sizes: 5.5 mm and 7.0 mm
        note: The 5.5 mm is needed permanently for all M3 nuts in the chassis. The
          7.0 mm is for the wheel nuts. The 10.0 mm mentioned in the Carten manual
          is not needed at all for this 1/10 model.
        status: Available (No purchase necessary)
      adhesives_and_chemicals:
        threadlocker:
          type: Screw Cement / Threadlocker
          note: highly important! Goes on all screws that are screwed into metal (e.g.
            motor pinion). Often incorrectly labeled as 'GLUE' in the Carten manual.
            Never use for plastic!
          brand: Loctite
          model: 243 Medium Strength (Blue)
      tapes:
        glass_tape:
          type: Glass Tape
          note: Mandatory for the T410R! The car has no classic plastic battery holders.
            According to the manual, the tape is pulled through the slots in the carbon
            chassis to strap the LiPo battery down tightly.
          brand: Arrowmax
          model: Fibre Tape / Battery Tape
