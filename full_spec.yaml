Driveshaft And Joints:
  meta:
    component: Central Drive Shaft (Center Shaft)
  properties:
    material_and_suitability:
      driveshaft:
        component: Driveshaft (Shaft)
        material: Aluminum (anodized), hollow or solid (depending on batch)
        suitability_100kmh_3s: YES. Aluminum is better here than steel, since the
          lower rotating mass generates fewer vibrations at approx. 26,000 RPM.
      joint_cups:
        component: Connectors (Diff-Inputs)
        material: Steel (Hardened)
        suitability_100kmh_3s: YES. The mounts at the differential input are made
          of steel and withstand the torque of the 3S drive.
      rpm_load:
        component: Speed load
        specification: Shaft rotates at approx. 26,000 RPM
        suitability_100kmh_3s: Critical, but doable for the kit part, as long as there
          is no imbalance.
    mandatory_durability_measures:
      centering_floating_problem:
        issue: Centering (The 'Floating' problem)
        description: The shaft must not hit back and forth in the cups ('chatter').
        action: Mandatory to place small O-rings or foam pads (often included in the
          kit or cut from old shock rubbers) into the cups before the shaft is inserted.
          The shaft must sit 'floating', but without play between the diffs.
      joint_lubrication:
        issue: Lubrication of the joints
        description: The ends of the driveshaft (dogbones) that run in the steel cups
          are metal on metal. With 3S power, massive wear occurs here ('hammering
          in').
        action: Lubricate these contact points with viscous molybdenum grease (black)
          or special 'Joint Grease' to minimize friction.
      runout_check:
        issue: Check for concentricity
        description: Roll the shaft over a glass plate (or a mirror) before installation.
        action: If it 'wobbles' even minimally (is bent), it will set the entire chassis
          into destructive vibrations at 26,000 RPM. In this case, it must be replaced
          immediately.
Differentials:
  meta:
    type: Oil-filled bevel differential (Metal Gear)
    mechanical_load_capacity: '> 100 km/h (approx. 8,300 RPM axle speed)'
  properties:
    material_and_construction:
      gears_ring_and_bevel: Sintered metal / Steel
      diff_outdrives_cup_joints: Hardened steel
      diff_case_cup: Fiber-reinforced composite plastic
    mandatory_modifications:
      perfect_shimming:
        issue: Freedom from play
        description: The inner metal gears must be adjusted absolutely free of play
          during assembly with ultra-thin shims. Only this way is it prevented that
          the teeth skip or tear off under the high torque of the 3S motor.
      reinforced_sealing:
        issue: O-ring sealing
        description: At 8,300 RPM, the oil inside generates a massive centrifugal
          pressure outwards. The rubber O-rings must be sealed with viscous special
          grease (e.g. 'Green Slime') so that the differential does not run dry.
      oil_viscosity:
        issue: Locking effect & straight-line stability
        description: The kit oil is too soft and leads to uncontrollable breakouts
          during speedruns if one wheel loses minimal grip. Highly viscous silicone
          oil must be used to force the car into a stubborn straight-line drive.
        setup_recommendation:
          front_axle: approx. 100,000 cSt (or a completely rigid spool/solid axle)
          rear_axle: approx. 10,000 cSt
Tires:
  meta:
    brand: Sweep Racing
    model: HANKOOK Tread Belted (SR-SSF-36AWPG)
    type: Fabric-reinforced rubber hollow chamber tire (Belted)
    tread: Licensed Hankook tread (optimized for parking lot asphalt)
    shore_hardness: 36° (Medium/Hard - ideal compromise of grip and durability with
      extreme friction)
    wheel_hub: 12mm Hex - Suitable for kit hubs of the Carten T410R
    assembly_status: Pre-glued (Industrially glued at the factory on spoke wheels)
    shopping_item:
      add_to_list: true
      item_name: Sweep HANKOOK Belted Tires 36deg Pre-glued (SR-SSF-36AWPG)
      category: Wheels & Tires
      reference_link: Search for Sweep SR-SSF-36AWPG at common RC shops
      estimated_price_eur: 34.9
  properties:
    setup_instructions:
      ballooning_protection: Thanks to the inner Kevlar/nylon fabric insert, the tire
        does not expand at approx. 8,800 RPM (axle speed at 100 km/h). The aerodynamics
        of the ZooRacing Hellcat and the ride height remain constantly safe.
      wheel_nut_securing: Mandatory to use locknuts with an intact nylon ring (M4)
        and tighten firmly. The brutal acceleration of the 3660 motor can spin off
        loose nuts immediately.
      balancing: Despite industrial production, tires can have slight imbalances.
        In case of strong vibrations on the jacked-up chassis, balance the wheels
        (e.g. with putty lead in the rim) so as not to destroy the wheel bearings
        of the Carten T410R at 100 km/h.
      break_in_scrubbing: The smooth production layer on the rubber must first be
        worn off. Use the first test runs to calibrate the ESC to build up the grip
        for the final topspeed run.
Paint:
  meta:
    brand: Tamiya
    system: 3-layer metallic structure
    type: Special polycarbonate spray (Lexan) - Etches into the plastic
    properties: Highly flexible, highly resistant to peeling in crashes.
    shopping_items:
    - item_name: Tamiya PS-15 Metallic Red (100ml)
      reference_link: Search for Tamiya PS-15 at RC shops
      estimated_price_eur: 8.5
    - item_name: Tamiya PS-12 Silver (100ml)
      reference_link: Search for Tamiya PS-12 at RC shops
      estimated_price_eur: 8.5
    - item_name: Tamiya PS-5 Black (100ml)
      reference_link: Search for Tamiya PS-5 at RC shops
      estimated_price_eur: 8.5
  properties:
    preparation_prep:
      step_1_washing: Wash the body thoroughly from the INSIDE with lukewarm water
        and simple dish soap (without care additives). Dry with kitchen paper. This
        removes production grease and prevents the paint from peeling off.
      step_2_masking: Stick the included window decals from the INSIDE onto the windows.
        Rub the edges of the decals firmly with your fingernail or a toothpick, so
        that no paint can run under later.
      step_3_warming: Place all three spray cans in a bowl of warm (not boiling!)
        tap water for 10 minutes. The pressure rises slightly, the paint atomizes
        much finer and does not form thick drops when spraying.
    execution_3_layers:
      rule_number_1: LEXAN IS ALWAYS PAINTED FROM THE INSIDE! The outer, matte protective
        film stays on the body until the very last step!
      phase_1_main_color_ps15:
        passes: 3 to 4 wafer-thin layers
        technique: The FIRST layer is just a fine mist (tack coat). It MUST look blotchy
          and transparent! Do not try to make it opaque immediately. Wait 10 minutes.
          Then spray the next thin layer. Repeat until the red is used up.
      phase_2_brilliance_ps12:
        passes: 2 thin layers
        technique: When the red is completely dry (wait at least 30 mins), spray the
          silver in 2 passes (with a 10 min break) directly onto the red. This acts
          as a reflector for the metallic particles and makes the red shine brightly.
      phase_3_sealing_ps5:
        passes: 1 to 2 thin layers
        technique: When the silver is dry, spray the black as the final layer over
          it. This blocks any light from below, makes the red very rich and ensures
          that your car looks highly professional, black and clean from the inside.
    finish_and_assembly:
      step_1_remove_masks: When the black is dry to the touch (after approx. 1-2 hours),
        carefully peel off the window masks from the inside.
      step_2_magic_moment: Now peel off the outer, matte protective film of the body.
        Underneath, the mirror-smooth, perfect metallic red is revealed!
