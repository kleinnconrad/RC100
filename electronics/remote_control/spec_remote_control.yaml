      fail_safe_activation: Das Fail-Safe muss zwingend auf Bremse programmiert werden! Auto aufbocken, Vollbremsung an der Funke halten und den Setup-Knopf am Empfänger drücken. Beim Ausschalten der Funke muss das Auto sofort bremsen.
      steering_dual_rate: Über den Dual Rate (D/R) Drehregler an der Fernsteuerung den maximalen Lenkausschlag zwingend reduzieren. Bei 100 km/h führt ein voller Lenkausschlag zum Überschlag.
      throttle_trim: Die Trimmung für das Gas (TH Trim) muss exakt auf dem Nullpunkt (Mitte) stehen, bevor der Regler kalibriert wird.
      bec_voltage_warning: Das BEC des Reglers muss mit der Eingangsspannung des Empfängers abgeglichen werden.
