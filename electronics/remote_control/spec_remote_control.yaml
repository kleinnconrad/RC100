    brand: Konect
    model: X9S Radio + RG4CHWP Empfänger
    type: 4-Kanal 2.4 GHz Pistolengriff-Sender
    channels: 4
    price_class: Mid-Range (~152 EUR)
    shopping_item:
      in_liste_aufnehmen: true
      artikel_name: X9S Radio + Mini Waterproof 4-Channel Receiver RG4CHWP
