    integrated_features:
    - Fail-Safe Funktion (Schutz bei Signalverlust)
    input_voltage: 'Abstimmung mit BEC des ESC erforderlich'
  properties:
    tx_performance:
      protocol: 2.4Ghz
      range_ground: >200m
      response_time: Geringe Latenz für hohe Präzision
      power_supply: Senderbatterien gemäß Herstellervorgabe
      potentiometer: Hall Sensor für möglichst hohe Präzision
