spec:
  meta:
    brand: Savöx
    model: SC-1252MG+
    type: Digitales Low-Profile Servo
    features: Coreless Motor, hohe Stellgeschwindigkeit und Präzision
    price_class: Mid-Range (~52,72 EUR)
  properties:
    mechanical_specifications:
      gears: Metallgetriebe
      case: Kunststoff mit Aluminium-Mittelteil
      spline_teeth: '25T (Standard Futaba/Savöx)'
      dimensions_mm:
        length: 40.8
        width: 20.2
        height: 25.4
      weight_g: 44.0
    performance_specifications:
      operating_voltage: 4.8V - 6.0V
      torque_6v: 7.0 kg-cm
      speed_6v: 0.07 sec / 60°
      return_to_center_accuracy: Sehr gut (Hohe Präzision für reproduzierbaren Geradeauslauf)
    mandatory_upgrades:
      part: ALU CLAMP SERVO HORN - FUTABA, SAVÖX - 3-HOLE - 25T (HUD293409)
      reason: Garantiert eine absolut steife, spielfreie Lenkverbindung. Auf einen Servosaver wird komplett verzichtet, um maximale Genauigkeit zu erreichen.
      installation: Die Klemmschraube festziehen und die Hauptschraube zwingend mit Schraubensicherungslack (z. B. Loctite mittelfest) fixieren.
    transmitter_setup:
      dual_rate: Für den 100 km/h Run muss an der Fernsteuerung zwingend das 'Dual Rate' (D/R) oder der Lenkausschlag (EPA) reduziert werden. Minimale Lenkbewegungen reichen bei Top-Speed aus.
