spec:
  meta:
    type: Non-contact Laser Tachometer
    reference_model: DT-2234C+ (or identical clones like Neoteck/Proster)
    measuring_range: 2.5 to 99,999 RPM
    measuring_accuracy: +/- 0.05%
    shopping_item:
      add_to_list: true
      item_name: Digital Laser Tachometer (DT-2234C+)
      category: Workshop & Tools
      reference_link: Search Amazon for 'Laser Tachometer DT-2234C+'
      estimated_price_eur: 18.0
  properties:
    test_protocol:
      preparation: Stick reflector strip (included) on the tire sidewall or pinion.
      execution: Jack up the vehicle safely. Turn on the remote control, apply full throttle and
        point the laser at the rotating strip.
      safety_warning: 'IMPORTANT: At 100 km/h wheel rotation speed, rubber tires
        expand significantly (ballooning). Wear safety goggles and do not stand directly
        in the centrifugal line of the wheels in case the tire glue fails!'
