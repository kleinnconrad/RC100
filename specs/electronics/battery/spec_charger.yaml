spec:
  meta:
    brand: SkyRC
    model: S100neo
    type: Smart AC/DC Charger
    architecture_fit: optimal. Has XT60 socket built directly into the housing. No adapter chaos.
  properties:
    power_specifications:
      input_voltage_ac: 100-240V (Integrated power supply for normal socket)
      input_voltage_dc: 6-30V
      charge_power_max_ac: 100W
      charge_power_max_dc: 200W
      discharge_power_max: 5W (Main port) / 20W (Balance port)
    charging_capabilities:
      supported_chemistries:
      - LiPo
      - LiIon
      - LiFe
      - LiHV
      - NiMH
      - NiCd
      - Pb
      supported_cells_lipo: 1S to 6S
      charge_current_range: 0.1A - 12.0A
      discharge_current_range: 0.1A - 2.0A
      balancer_current_max: 1.0A
    physical_specifications:
      display: Color LCD Screen
      dimensions_mm:
        length: 105
        width: 105
        height: 62
      weight_g: 340
      control_interface: Simple 3-button control
    lipo_safety_and_workflow:
      charging_rule: Always charge the 5000mAh battery with '1C'. Set the charge current
        on the charger to exactly 5.0A.
      storage_rule: NEVER leave the battery empty in the corner after driving. Always
        start the 'Storage' program on the S100neo to bring the cells to 3.8V storage voltage.
      fire_safety: Always charge and store batteries in a fireproof LiPo safe bag.
