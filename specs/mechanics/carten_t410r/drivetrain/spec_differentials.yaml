spec:
  meta:
    type: Oil-filled bevel differential (Metal Gear)
    mechanical_load_capacity: '> 100 km/h (approx. 8,300 RPM axle speed)'
  properties:
    material_and_construction:
      gears_ring_and_bevel: Sintered metal / Steel
      diff_outdrives_cup_joints: Hardened steel
      diff_case_cup: Fiber-reinforced composite plastic
    mandatory_modifications:
      perfect_shimming:
        issue: Freedom from play
        description: The inner metal gears must be adjusted absolutely free of play during assembly
          with ultra-thin shims. Only this way is it prevented
          that the teeth skip or tear off under the high torque of the 3S motor.
      reinforced_sealing:
        issue: O-ring sealing
        description: At 8,300 RPM, the oil inside generates a massive centrifugal pressure
          outwards. The rubber O-rings must be sealed with viscous special grease (e.g. 'Green
          Slime') so that the differential does not run dry.
      oil_viscosity:
        issue: Locking effect & straight-line stability
        description: The kit oil is too soft and leads to uncontrollable
          breakouts during speedruns if one wheel loses minimal grip. Highly viscous silicone oil
          must be used to force the car into a stubborn straight-line drive.
        setup_recommendation:
          front_axle: approx. 100,000 cSt (or a completely rigid spool/solid axle)
          rear_axle: approx. 10,000 cSt
