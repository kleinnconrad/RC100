spec:
  meta:
    type: CARTEN NBA360 Stahl Hauptzahnrad (48 DP, 68T)
    mechanical_load_capacity: '> 100 km/h (ausgelegt für 3S / 120A Brushless-Systeme)'
  properties:
    material_and_construction:
      gear_body: Stahl - CNC gefräst
      mounting_interface: Standard 1:10 Tourenwagen 4-Loch-Aufnahme
      mating_pinion: Gehärteter Stahl (zwingend erforderlich)
    mandatory_modifications:
      pinion_securing:
        issue: Verrutschen des Motorritzels (Ursache für Getriebeschaden)
        description: Um ein erneutes Verrutschen und Zerstören des Hauptzahnrads durch
          asymmetrischen Eingriff zu verhindern, muss die Madenschraube des Hartstahl-Ritzels
          zwingend mit mittelfester Schraubensicherung (z. B. Loctite 243 / blau)
          auf der flachen Stelle der Motorwelle gesichert werden.
      gear_mesh_calibration:
        issue: Zahnflankenspiel bei > 11.000 U/min
        description: Das Spiel zwischen Stahlritzel und Stahl-Hauptzahnrad muss mit
          der bewährten Papiermethode exakt kalibriert werden. Ein zu enges Spiel
          führt zu extremer Reibungshitze, Leistungsverlust und hohem Verschleiß.
      material_selection:
        issue: Wechsel zu Stahl-Hauptzahnrad
        description: Aufgrund vorheriger Schäden an Kunststoff-Zahnrädern wurde auf
          ein robusteres Stahl-Hauptzahnrad gewechselt. Dies erhöht die rotierende Masse,
          sichert jedoch die mechanische Integrität des Antriebsstrangs bei hohen Drehmomenten.
