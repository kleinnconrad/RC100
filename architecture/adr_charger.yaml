adr:
  id: ADR-004
  title: Selection of the charger for 3S LiPo batteries
  status: decided
  date: '2026-03-06'
  context: "Charging the 3S LiPo battery defined in ADR-003 (11.1V, 5000mAh, 55.5 \nWh) requires a \nsafe and powerful charger. To gently charge the battery \nwith 1C (5 Amps), \na charging power of at least 63 Watts \n(5 Amps * 12.6V end-of-charge voltage) is required. \nIn addition, the charger must \nexactly monitor the cell voltages (balancing) and be able to measure the internal \nresistance of the cells to prevent fire hazards. The connector must \nbe able to safely transmit the \nhigh currents via an XT60 plug.\n"
  considered_alternatives:
  - option_id: 1
    name: Budget / Plug Charger (e.g. 20W Basic Charger)
    type: Low-End / No Display
    evaluation: Very cheap, but massively undersized at approx. 20W. Charging
      the 5000mAh battery would take over 3 hours. It lacks a display to monitor
      the end-of-charge voltage and cell drift. A high safety risk at
      3S.
  - option_id: 2
    name: High-End Dual Charger (e.g. Hota D6 Pro / SkyRC D200neo)
    type: Premium / 200W+ / Dual Channel
    evaluation: Offers two independent charging outputs and enormous power (often 200W
      AC). Optimal for operation on racetracks with multiple batteries. However, for this
      single-car project, it is highly oversized (over-engineering) and often
      too expensive (> 120 €).
  - option_id: 3
    name: SkyRC S100neo
    type: Smart AC/DC Charger (Mid-Range)
    evaluation: Offers 100 Watts of AC charging power from a normal socket (easily
      enough for the required 63 Watts at 1C). Has a color display for detailed
      telemetry (cell voltage) and has a native XT60 connection in the housing.
  decision: SkyRC S100neo
  charger_meta:
    brand: SkyRC
    model: S100neo
    type: Smart AC/DC Charger
  rationale: "The decision is made in favor of the SkyRC S100neo. It optimally covers the \"sweet spot\" \nbetween safety, \nperformance and budget. The 100 Watts of internal power (AC) are more than sufficient \nto gently fully charge the 3S 5000mAh LiPo in about an \nhour. Particularly advantageous is \nthe XT60 connector firmly integrated into the front panel, which makes dangerous and error-prone \nadapter cables \nsuperfluous. This fits perfectly with the architecture decision of the Absima battery.\n"
  consequences:
  - 'Safety during charging: In addition to the XT60 main connector, the white JST-XH
    balancer cable of the battery must strictly be plugged into the port of the charger, otherwise
    the individual cells will not be monitored.'
  - 'Cable minimalism: No additional charging cables are required (battery is
    plugged directly into the device).'
  - 'Cooling: The charger has an active fan. During charging,
    ensure a safe stand and free air supply.'
