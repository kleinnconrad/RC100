adr:
  id: ADR-006
  title: Selection of the steering servo for precise high-speed control
  status: decided
  date: '2026-08-21'
  context: "At speeds of 100 km/h, enormous aerodynamic and mechanical \nforces act \non the front wheels of the Carten T410R. A minimal jitter, play \nor a too slow \nreaction time of the steering servo can immediately lead to loss of control \nand total failure. \nIn addition, space in a 1:10 touring car chassis \nis limited. Since our MVP remote control \n(Carson Reflex Wheel X1) does not have an electronic gyro, the servo must \nhold the \nstraight line mechanically very precisely and powerfully. A servo \nwith metal gears (robustness), \nhigh speed (~0.11s) and sufficient \ntorque (approx. 9 kg) is required.\n"
  considered_alternatives:
  - option_id: 1
    name: Standard RTR / Plastic Gear Servo (3-6 kg)
    type: Low-End / Standard Size
    evaluation: Very cheap (often < 15 €), but life-threatening for the project.
      Plastic gears shear off immediately under the restoring forces at 100 km/h. With
      often > 0.15s positioning time much too slow.
  - option_id: 2
    name: High-End Brushless Full-Size Servo (e.g. Savöx SB-2290SG)
    type: Premium / Standard Size / 50+ kg
    evaluation: 'Monstrous torque and very fast. But: Completely oversized
      (Over-Engineering), very expensive (> 130 €) and above all too large as a full-size servo
      for the compact chassis.'
  - option_id: 3
    name: Savöx SC-1251MG+
    type: Mid-Range / Low-Profile / Metal Gear
    evaluation: The absolute gold standard in the 1:10 touring car sector. However, at approx. 55-65
      € relatively expensive for our current budget MVP approach, even if the quality
      and speed (0.09s) are outstanding.
  - option_id: 4
    name: JX PDI-4409MG
    type: Budget / Low-Profile / Metal Gear
    evaluation: An excellent price-performance ratio (~15-22 €). Offers a
      robust metal gear, sufficient torque (9.2 kg) and a very good
      reaction time (0.11s) in a space-saving low-profile design.
  decision: Savöx SC-1252MG+
  servo_meta:
    brand: Savöx
    model: SC-1252MG+
    type: Digital Low-Profile Servo
  rationale: "Test drives showed that the previous setup did not provide the required steering precision. The servo did not reproducibly return to the neutral position. Therefore, a change was made to the Savöx SC-1252MG+ (52.72 €). It offers a speed of 0.07s and a torque of 7 kg. This ensures a precise return to the neutral position.\n"
  consequences:
  - 'Servo horn: To minimize play in the steering system, a rigid aluminum lever (ALU CLAMP SERVO HORN - FUTABA, SAVÖX - 3-HOLE - 25T, item HUD293409) is mounted without a servo saver.'
  - 'BEC voltage: The BEC output voltage of the controller is configured to 6.0V.'
  - 'Dual-Rate: The maximum steering angle is limited on the remote control to ensure stability at 100 km/h.'
