adr:
  id: ADR-010
  title: Selection of the GPS measuring system to validate the 100 km/h mark
  status: decided
  date: '2026-03-10'
  context: "The calculated mathematical models (axle speed, rolling resistance, \nvoltage drop) \nmust be validated in reality ('integration test' on the street) \nby hard telemetry data. \nSince the vehicle often only holds the top speed of 100 km/h for a time window \nof 2 to 3 seconds, a very high sampling rate (update frequency) of the \nmeasuring device is absolutely required. \nAt the same time, the module must not \nnegatively affect the vehicle weight (CG) \nand the aerodynamics.\n"
  considered_alternatives:
  - option_id: 1
    name: Smartphone with GPS App
    type: Free / 1Hz Standard GPS
    evaluation: Free, but architecturally useless. A smartphone weighs
      too much (>150g), massively disturbs the vehicle balance and the standard sampling rate
      of 1Hz is too slow to capture the real peak speed. In addition, there is
      an extreme risk of destroying an expensive device in a crash.
  - option_id: 2
    name: Cheap Bicycle Speedometer / Mini GPS Tracker
    type: Budget / 1Hz to 2Hz
    evaluation: Very cheap (~20 €), but often too inaccurate during rapid acceleration.
      No suitable apps for evaluating acceleration curves.
  - option_id: 3
    name: Ruddog GPS Performance Analyzer
    type: RC-specific 10Hz GNSS Logger
    evaluation: Compact, very light at approx. 38g and offers a sampling rate of
      10 measurements per second (10Hz). Records G-forces, acceleration times
      and average speeds in addition to top speed. Convenient reading via Bluetooth and
      smartphone app.
  decision: Ruddog GPS Performance Analyzer
  gps_meta_hardware:
    brand: Ruddog
    model: GPS Performance Analyzer
    type: 10Hz GNSS Telemetry Module with Bluetooth
  rationale: "The decision is made in favor of the Ruddog GPS Performance Analyzer. It is \nthe perfect 'fit-for-purpose' \ntool for this project. The 10Hz sampling rate \nguarantees that the exact top speed \nis recorded, even if \nit is only applied for a fraction of a second. The low weight \nof 38g does not change the driving behavior of the Carten T410R, and the Bluetooth app interface \nsaves a heavy, readable display directly on the vehicle.\n"
  consequences:
  - 'Signal constraint: The GPS signal easily passes through lexan bodies, but is
    massively blocked by carbon fibers. The module must not be mounted directly
    *under* the carbon upper deck in the Carten T410R. The optimal position is on the
    foam bumper in the front.'
  - 'Mounting: The device must be fixed very securely (e.g. with strong velcro or 3M
    Dual Lock) so that it does not fly away as a projectile in the event of a rollover at 100 km/h.'
