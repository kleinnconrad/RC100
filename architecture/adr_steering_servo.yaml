adr:
  id: ADR-006
  title: Auswahl des Lenkservos für präzise High-Speed-Kontrolle
  status: entschieden
  date: '2026-08-21'
  context: "Bei Geschwindigkeiten von 100 km/h wirken enorme aerodynamische und mechanische\
    \ Kräfte \nauf die Vorderräder des Carten T410R. Ein minimales Zittern, Spiel\
    \ oder eine zu langsame \nReaktionszeit des Lenkservos können sofort zum Kontrollverlust\
    \ und Totalausfall führen. \nZudem ist der Platz in einem 1:10 Tourenwagen-Chassis\
    \ begrenzt. Da unsere MVP-Fernsteuerung \n(Carson Reflex Wheel X1) über keinen\
    \ elektronischen Gyro verfügt, muss das Servo den \nGeradeauslauf mechanisch stark\
    \ präzise und kraftvoll halten. Gefordert ist ein Servo \nmit Metallgetriebe (Robustheit),\
    \ hoher Stellgeschwindigkeit (~0.11s) und ausreichender \nStellkraft (ca. 9 kg).\n"
  considered_alternatives:
  - option_id: 1
    name: Standard RTR / Plastikgetriebe-Servo (3-6 kg)
    type: Low-End / Standardgröße
    evaluation: Sehr günstig (oft < 15 €), aber lebensgefährlich für das Projekt.
      Plastikzahnräder scheren bei den Rückstellkräften bei 100 km/h sofort ab. Mit
      oft > 0.15s Stellzeit viel zu langsam.
  - option_id: 2
    name: High-End Brushless Full-Size Servo (z.B. Savöx SB-2290SG)
    type: Premium / Standardgröße / 50+ kg
    evaluation: 'Monströse Stellkraft und stark schnell. Aber: Völlig überdimensioniert
      (Over-Engineering), stark teuer (> 130 €) und vor allem als Full-Size-Servo
      zu groß für das kompakte Chassis.'
  - option_id: 3
    name: Savöx SC-1251MG+
    type: Mid-Range / Low-Profile / Metallgetriebe
    evaluation: Der absolute Goldstandard im 1:10 Tourenwagen-Bereich. Mit ca. 55-65
      € jedoch für unseren aktuellen Budget-MVP-Ansatz relativ teuer, auch wenn Qualität
      und Stellzeit (0.09s) überragend sind.
  - option_id: 4
    name: JX PDI-4409MG
    type: Budget / Low-Profile / Metallgetriebe
    evaluation: Ein hervorragendes Preis-Leistungs-Verhältnis (~15-22 €). Bietet ein
      robustes Metallgetriebe, ausreichend Stellkraft (9.2 kg) und eine sehr gute
      Reaktionszeit (0.11s) in platzsparender Low-Profile-Bauweise.
  decision: Savöx SC-1252MG+
  servo_meta:
    brand: Savöx
    model: SC-1252MG+
    type: Digitales Low-Profile Servo
  rationale: "Testfahrten zeigten, dass das bisherige Setup die erforderliche Lenkgenauigkeit nicht lieferte. Das Servo kehrte nicht reproduzierbar in die Neutralposition zurück. Daher wurde auf das Savöx SC-1252MG+ (52,72 €) gewechselt. Es bietet eine Stellgeschwindigkeit von 0,07s und eine Stellkraft von 7 kg. Dies gewährleistet eine präzise Rückstellung auf die Neutralposition.\n"
  consequences:
  - 'Servohorn: Um das Spiel im Lenksystem zu minimieren, wird ein starrer Aluminium-Hebel (ALU CLAMP SERVO HORN - FUTABA, SAVÖX - 3-HOLE - 25T, Artikel HUD293409) ohne Servosaver montiert.'
  - 'BEC-Spannung: Die BEC-Ausgangsspannung des Reglers wird auf 6.0V konfiguriert.'
  - 'Dual-Rate: Der maximale Lenkausschlag wird an der Fernsteuerung begrenzt, um die Stabilität bei 100 km/h sicherzustellen.'
